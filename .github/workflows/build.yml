name: Build app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Download reading and image-recognition data
        run: |
          mkdir -p app/src/main/assets/tessdata
          for l in eng urd ara; do
            curl -fsSL -o app/src/main/assets/tessdata/$l.traineddata \
              https://github.com/tesseract-ocr/tessdata_fast/raw/main/$l.traineddata
          done
          curl -fsSL -o app/src/main/assets/mobilenet_v3_small.tflite \
            https://storage.googleapis.com/mediapipe-models/image_embedder/mobilenet_v3_small/float32/1/mobilenet_v3_small.tflite
          ls -la app/src/main/assets app/src/main/assets/tessdata

      - name: Build APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Siftly.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Siftly 1.0.${{ github.run_number }}
          body: Download Siftly.apk on your phone and open it to install.
          files: Siftly.apk
          make_latest: true
